<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/logo.png?v=4" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://www.gstatic.com; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://*.firebaseio.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.firebaseio.com https://*.googleapis.com https://fcm.googleapis.com https://fonts.googleapis.com https://fonts.gstatic.com; img-src 'self' data: blob: https://fonts.gstatic.com https://fonts.googleapis.com https://www.gstatic.com; font-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com; worker-src 'self' blob: https://www.gstatic.com; base-uri 'self'; form-action 'self'" />
    <meta name="description" content="Elipse HR — Secure Attendance & Human Resource Management Portal" />
    
    <!-- Native PWA Downloadable App Meta Tags & Dynamic Theme Icons -->
    <link rel="manifest" href="/manifest.json?v=4" />
    <meta name="theme-color" content="#090d16" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Elipse HR" />
    <link rel="shortcut icon" href="/icons/logo.png?v=4" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/logo.png?v=4" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/logo.png?v=4" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/logo.png?v=4" />

    <title>Elipse HR Portal</title>
    
    <script>
      // 1. Prevent Browser & Touch Zoom (Desktop & Mobile)
      document.addEventListener('wheel', function (e) {
        if (e.ctrlKey) {
          e.preventDefault();
        }
      }, { passive: false });

      document.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && (e.key === '+' || e.key === '-' || e.key === '=' || e.key === '0')) {
          e.preventDefault();
        }
      });

      document.addEventListener('gesturestart', function (e) {
        e.preventDefault();
      });

      // 2. Register Service Worker v2 (Detects updates & dispatches sw-update-available)
      if ('serviceWorker' in navigator) {
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            window.__swRegistration = reg;
            reg.update();

            const onNewWorker = (worker) => {
              worker.addEventListener('statechange', () => {
                if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                  window.dispatchEvent(new CustomEvent('sw-update-available', { detail: worker }));
                }
              });
            };

            if (reg.waiting) {
              window.dispatchEvent(new CustomEvent('sw-update-available', { detail: reg.waiting }));
            }

            reg.addEventListener('updatefound', () => {
              if (reg.installing) {
                onNewWorker(reg.installing);
              }
            });
          }).catch(() => {});
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
